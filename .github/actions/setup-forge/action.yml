name: Set up forge
description: Installs jq and the forge commit pinned in .forge-version, cached by that commit.

runs:
  using: composite
  steps:
    - id: version
      shell: bash
      run: echo "rev=$(cat .forge-version)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v4
      id: cache
      with:
        path: ~/.cargo/bin/forge
        key: forge-${{ runner.os }}-${{ steps.version.outputs.rev }}

    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: cargo install --locked --git https://github.com/cloudflare/forge --rev "${{ steps.version.outputs.rev }}" forge

    - shell: bash
      run: |
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        command -v jq >/dev/null || sudo apt-get install -y jq
