name: Release

# Publishes to npm when a GitHub release is published. npm trusts this
# workflow file as the package's trusted publisher, so it needs no npm token
# and every version gets a provenance attestation.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Trusted publishing needs npm 11.5.1 or later, which Node 24 ships.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check that the tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [[ "$TAG" != "v$version" ]]; then
            echo "Release tag $TAG does not match package.json version $version (expected v$version)" >&2
            exit 1
          fi
      - run: npm ci
      # prepublishOnly builds and runs the tests, the live ones included.
      - name: Publish
        env:
          ROICAI_API_KEY: ${{ secrets.ROICAI_API_KEY }}
          DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
        run: npm publish --tag "$DIST_TAG"
