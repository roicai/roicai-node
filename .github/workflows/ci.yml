name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
        env:
          ROICAI_API_KEY: ${{ secrets.ROICAI_API_KEY }}

  generated:
    name: generated code matches openapi.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-forge
      - run: scripts/generate.sh --committed
      - name: Fail if src/generated was edited by hand or not regenerated
        run: git diff --exit-code -- src/generated
